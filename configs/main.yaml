# The paper's main model. Every model, loss, data and schedule default in gtf/config.py is already this model;
# this file adds the training topology and the corpus paths. Train with:
#   python -m gtf.training.train --config configs/main.yaml
# Global batch: 2 nodes x 8 GPUs x 32 windows = 512, 40K steps.
trainer:
  devices: 8
  num_nodes: 2
  run_name: main
data:
  manifest_path: datasets/canonical_manifest.json
  stats_path: datasets/normalization_stats.pt
  uni3d_cache_path: datasets/uni3d_embeddings.pt
