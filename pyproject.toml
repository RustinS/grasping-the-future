[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gtf"
version = "0.1.0"
description = "Grasping the Future: a generative model of hand-object manipulation and the pipeline that produces its data"
readme = "README.md"
requires-python = ">=3.11"
# Tested with Python 3.11, PyTorch 2.10 (CUDA 12.9), numpy 1.26. Install PyTorch for your CUDA first (README.md).
# Training, evaluation and inference:
dependencies = [
    "torch>=2.6",
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "lightning>=2.4",
    "omegaconf>=2.3",
    "h5py>=3.10",
    "trimesh>=4.0",
    "libigl>=2.5",
    "roma>=1.5",
    "timm>=1.0",
    "addict",
    "easydict",
    "rich",
    "tqdm",
    "huggingface_hub>=0.34",
    "spconv-cu126>=2.3.8",
    "torch-scatter>=2.1",
    "chumpy @ git+https://github.com/mattloper/chumpy@580566e",
    "manopth @ git+https://github.com/hassony2/manopth@4f1dcad",
]

[project.optional-dependencies]
# Tests and linting.
dev = ["pytest>=8", "ruff>=0.6"]
# Logging training runs to Weights & Biases (trainer.use_wandb=true).
wandb = ["wandb>=0.17"]
# Inference on new data (gtf/predict.py) and building a training corpus (gtf/datasets, scripts/build_corpus.sh).
# PyTorch3D (farthest-point sampling) is installed from source, see README.md.
corpus = [
    "opencv-python>=4.9",
    "imageio>=2.34",
    "pyyaml",
    "requests",
    "gdown",
    "kagglehub",
    "transformers==4.57.1",
    "open3d>=0.18",
    "threadpoolctl",
    "scikit-learn>=1.4",
    "av>=12",
    "decord>=0.6",
    "moge @ git+https://github.com/microsoft/MoGe@a8c37341bc0325ca99b9d57981cc3bb2bd3e255b",
]
# Extracting trajectories from video (gtf/extraction); third-party/setup.sh extraction adds the source builds.
extraction = [
    "gtf[corpus]",
    "vllm>=0.19",
    "sam3 @ git+https://github.com/facebookresearch/sam3@f6e51f59500a87c576c2df2323ce56b9fd7a12de",
    "pandas>=2.2",
    "pyarrow>=15",
    "warp-lang>=1.12",
    "flash-attn>=2.8",
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1",
]

[project.scripts]
gtf-train = "gtf.training.train:main"
gtf-benchmark = "gtf.eval.benchmark:main"
gtf-predict = "gtf.predict:main"
gtf-extract = "gtf.extraction.action100m.pipeline:main"

[tool.setuptools.packages.find]
include = ["gtf*"]

[tool.setuptools.package-data]
"gtf.datasets" = ["ho3d_scene_gravity.json"]

[tool.ruff]
line-length = 175
